name: flutter_app_kanu
description: "KANU — application mobile native (Flutter) de rencontres sérieuses 30 ans et plus. Remplace la WebView par une expérience 100% native."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (Riverpod)
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^18.0.2

  # Réseau / API (PocketBase REST)
  dio: ^5.11.1

  # Persistance locale
  shared_preferences: ^2.5.6

  # Médias & divers
  cached_network_image: ^4.0.4
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.3

  # Helpers
  intl: ^0.20.2
  equatable: ^2.1.0















dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/images/logo.png'
  adaptive_icon_background: '#0A0A0A'
  adaptive_icon_foreground: 'assets/images/logo.png'
