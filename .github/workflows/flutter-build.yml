name: Flutter build

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-build.yml"
  pull_request:
    paths:
      - "flutter_app/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: flutter_app

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  ios:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # No Apple signing certificate is configured in this repo, so this only
      # validates that the iOS target compiles (equivalent of an Xcode
      # "Build" without "Archive"). A distributable .ipa still needs a real
      # Apple Developer account and signing set up in Xcode on a Mac, or
      # signing secrets added to this workflow.
      - run: flutter build ios --release --no-codesign

  ios-testflight:
    needs: analyze
    runs-on: macos-latest
    # Runs on pushes to main or a manual trigger — never on PRs, since forks/PRs
    # don't get repo secrets anyway (the job would just fail there).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    env:
      KEYCHAIN_PATH: ${{ github.workspace }}/signing.keychain-db
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Import signing certificate and provisioning profile
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "${{ secrets.IOS_DIST_CERT_BASE64 }}" | base64 --decode -o "$CERT_PATH"
          echo "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "${{ secrets.IOS_DIST_CERT_PASSWORD }}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Install App Store Connect API key
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY_BASE64 }}" | base64 --decode \
            -o ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8

      - name: Read provisioning profile UUID and name
        id: profile
        run: |
          set -euo pipefail
          PROFILE="$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          PLIST=$(security cms -D -i "$PROFILE")
          UUID=$(echo "$PLIST" | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          NAME=$(echo "$PLIST" | plutil -extract Name xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Write ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.kanurencontres.app</key>
              <string>${{ steps.profile.outputs.name }}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Build signed IPA
        run: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f build/ios/ipa/*.ipa \
            -t ios \
            --apiKey "${{ secrets.APPSTORE_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_API_ISSUER_ID }}"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
