name: Flutter build

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-build.yml"
  pull_request:
    paths:
      - "flutter_app/**"

defaults:
  run:
    working-directory: flutter_app

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      # Debug build: doesn't need a signing config or google-services.json
      # (see android/app/build.gradle.kts — the google-services plugin only
      # applies once flutterfire configure has dropped a real one in).
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: kanu-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk

  ios:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # No Apple signing certificate is configured in this repo, so this only
      # validates that the iOS target compiles (equivalent of an Xcode
      # "Build" without "Archive"). A distributable .ipa still needs a real
      # Apple Developer account and signing set up in Xcode on a Mac, or
      # signing secrets added to this workflow.
      - run: flutter build ios --release --no-codesign
